function isExcluded(d){return isArchived(d)||inSet(EXCLUDE_STATUS,statusKey(d));}

/* ===== product cost matching ===== */
function normName(s){return String(s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
var _byId={},_byName={};
PRODUCTS.forEach(function(p){_byId[p.id]=p;_byName[normName(p.title)]=p;});
function catalogById(id){if(id==null)return null;return _byId[id]||_byId[Number(id)]||null;}
function catalogByName(name){var k=normName(name);if(_byName[k])return _byName[k];var best=null,bs=0;PRODUCTS.forEach(function(p){var a=normName(p.title).split(' '),b=k.split(' ');var setB={};b.forEach(function(w){setB[w]=1;});var ov=0;a.forEach(function(w){if(setB[w])ov++;});var sc=ov/Math.max(1,Math.max(a.length,b.length));if(sc>bs){bs=sc;best=p;}});return bs>=0.6?best:null;}
function dadPrice(p){if(!p)return null;if(costOverrides[p.id]!=null)return Number(costOverrides[p.id]);return p.dad;}
function orderCost(d){var a=Array.isArray(d.products)?d.products:[];var cost=0,complete=true,lines=[];a.forEach(function(l){var qty=Number(l.quantity)||1;var p=catalogById(l.id)||catalogByName(l.name);var dp=p?dadPrice(p):null;if(dp==null)complete=false;else cost+=dp*qty;lines.push({name:l.name||(p&&p.title)||"—",qty:qty,sell:Number(l.price)||(p&&p.sell)||0,dad:dp,matched:!!p});});return {cost:cost,complete:complete&&a.length>0,lines:lines};}
function effectiveCost(d){if(d.wholesaleCost!=null&&isFinite(Number(d.wholesaleCost)))return {cost:Number(d.wholesaleCost),complete:true,manual:true};var c=orderCost(d);return {cost:c.cost,complete:c.complete,manual:false};}
function orderProfit(d){var c=effectiveCost(d);if(!c.complete)return null;return orderTotal(d)-deliveryOf(d)-c.cost;}
function settlementDone(d){return d.settlementStatus==='settled';}

function normWil(s){var x=String(s||'').trim();x=x.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/^ال/,'').replace(/\s+/g,'');return x;}
var _feeByNorm={};Object.keys(DELIVERY_FEES).forEach(function(k){_feeByNorm[normWil(k)]=DELIVERY_FEES[k];});
function deliveryFeeFor(w,t){var f=DELIVERY_FEES[String(w||'').trim()]||_feeByNorm[normWil(w)];if(!f)return null;var home=f[0],office=f[1];if(t==='home')return home;return (office==null?home:office);}
function deliveryTypeOf(d){var t=String((d&&(d.deliveryType||d.delivery_type||d.livraison))||'').toLowerCase();if(t.indexOf('home')!==-1||t.indexOf('منزل')!==-1||t.indexOf('domicile')!==-1)return 'home';return 'office';}
function deliveryCostOf(d,tOverride){return deliveryFeeFor(orderWilaya(d),tOverride||deliveryTypeOf(d));}
function stopDeskFor(t){return t==='home'?0:1;}
/* delivery the customer ACTUALLY paid = total − product subtotal (total already includes delivery) */
function productSubtotal(d){var a=Array.isArray(d.products)?d.products:[];var t=0;for(var i=0;i<a.length;i++)t+=(Number(a[i].price)||0)*(Number(a[i].quantity)||0);return t;}
function deliveryOf(d){var tot=orderTotal(d);var sub=productSubtotal(d);if(sub>0&&tot>=sub)return tot-sub;var f=deliveryCostOf(d);return f==null?0:f;}
function guessDeliveryType(d){var w=orderWilaya(d);var f=DELIVERY_FEES[String(w||'').trim()]||_feeByNorm[normWil(w)];var dv=deliveryOf(d);if(f){if(f[1]!=null&&dv===f[1])return 'office';if(dv===f[0])return 'home';}return deliveryTypeOf(d);}

function loadCostOverrides(){return db.collection('config').doc('productCosts').get().then(function(doc){costOverrides=(doc.exists&&doc.data()&&doc.data().map)||{};costSource="cloud";}).catch(function(){try{costOverrides=JSON.parse(localStorage.getItem('robuste_costs')||'{}');}catch(e){costOverrides={};}costSource="local";});}

function robusteAdminKey(){var k="";try{k=localStorage.getItem("ROBUSTE_ADMIN_KEY")||"";}catch(e){}if(!k){try{k=(prompt("أدخل مفتاح الإدارة (ADMIN_KEY) لتفعيل إرسال حدث الشراء إلى ميتا — مرة واحدة فقط:")||"").trim();}catch(e){k="";}if(k){try{localStorage.setItem("ROBUSTE_ADMIN_KEY",k);}catch(e){}}}return k;}
function isPositiveStatusAdmin(st){var s=String(st||"").toLowerCase();if(/إلغ|لغى|لغي|cancel|annul|refus|رفض|راجع|إرجاع|مرتجع|retour|return|fake|وهمي|spam|تجريبي/.test(s))return false;return /أكد|ؤكد|تأكيد|confirm|تحضير|جاهز|prepar|ready|شحن|الطريق|توصيل|expedi|ship|transit|livr|تسليم|وصل|deliver/.test(s);}
/* ============ Meta event status (added) ============ */
function rbToast(msg,kind,ms){
  try{
    var box=document.getElementById("rbToastBox");
    if(!box){
      box=document.createElement("div");
      box.id="rbToastBox";
      box.setAttribute("style","position:fixed;left:16px;bottom:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;direction:rtl;max-width:min(92vw,430px)");
      document.body.appendChild(box);
    }
    var colors={ok:"#16a34a",err:"#dc2626",info:"#2563eb",wait:"#475569"};
    var el=document.createElement("div");
    el.setAttribute("style","background:"+(colors[kind]||colors.info)+";color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;cursor:pointer");
    el.textContent=msg;
    el.addEventListener("click",function(){try{el.parentNode.removeChild(el);}catch(e){}});
    box.appendChild(el);
    if(ms!==0)setTimeout(function(){try{el.parentNode.removeChild(el);}catch(e){}},ms||9000);
    return el;
  }catch(e){return null;}
}

      .then(function(res){return res.text().then(function(t){var d=null;try{d=JSON.parse(t);}catch(e){}return {status:res.status,ok:res.ok,data:d,text:t};});})

        if(r.data&&r.data.ok){rbToast("\u2705 \u062a\u0645 \u0625\u0631\u0633\u0627\u0644 \u062d\u062f\u062b \u0627\u0644\u0634\u0631\u0627\u0621 \u0625\u0644\u0649 \u0645\u064a\u062a\u0627 \u0628\u0646\u062c\u0627\u062d.\nID: "+id,"ok");return;}

  }catch(e){rbToast("\u274c \u062e\u0637\u0623 \u062f\u0627\u062e\u0644\u064a: "+String((e&&e.message)||e),"err",0);}

/* ============ Meta bulk tools (added) ============ */
function rbPhoneE164(p){var d=String(p||"").replace(/[^0-9]/g,"");if(d.indexOf("00")===0)d=d.slice(2);if(d.indexOf("213")===0)return d;if(d.charAt(0)==="0")return "213"+d.slice(1);if(d.length===9)return "213"+d;return d;}
function rbEligibleForMeta(){
  var out=[],now=Date.now(),max=6*86400000;
  for(var i=0;i<allOrders.length;i++){
    var o=allOrders[i],d=o.data||{};
    if(isExcluded(d))continue;
    if(!isPositiveStatusAdmin(statusKey(d)))continue;
    if(d.metaPurchaseSentAt)continue;
    var dt=orderDate(d);if(!dt)continue;
    if(now-new Date(dt).getTime()>max)continue;
    out.push(o);
  }
  return out;
}
function rbBulkSendMeta(){
  if(!ordersLoaded){rbToast("الطلبات لم تُحمّل بعد. انتظر قليلاً.","info");return;}
  var list=rbEligibleForMeta();
  if(!list.length){rbToast("لا توجد طلبات مؤهّلة للإرسال.\nالشروط: مؤكّدة + لم تُرسل سابقاً + عمرها أقل من 6 أيام.","info",14000);return;}
  if(!confirm("سيتم إرسال "+list.length+" طلب إلى ميتا. هل تريد المتابعة؟"))return;
  var k=robusteAdminKey();
  if(!k){rbToast("❌ لم تُدخل مفتاح الإدارة — لم يُرسل شيء.","err",0);return;}
  var ok=0,already=0,fail=0,i=0;
  var prog=rbToast("⏳ 0 / "+list.length,"wait",0);
  function step(){
    if(i>=list.length){
      rbRemoveToast(prog);
      rbToast("انتهى الإرسال:\n✅ نجح: "+ok+"\nℹ️ مُرسل سابقاً: "+already+"\n❌ فشل: "+fail,fail?"err":"ok",0);
      if(ordersLoaded){ordersLoaded=false;loadOrders();}
      return;
    }
    var id=list[i].id;i++;
    if(prog)prog.textContent="⏳ "+i+" / "+list.length;
    fetch(WORKER_URL+"/admin/confirm-purchase",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":k},body:JSON.stringify({id:id})})
      .then(function(res){return res.json().catch(function(){return null;});})
      .then(function(d){if(d&&d.already)already++;else if(d&&d.ok)ok++;else fail++;})
      .catch(function(){fail++;})
      .then(function(){setTimeout(step,350);});
  }
  step();
}
function rbExportMetaCsv(){
  if(!ordersLoaded){rbToast("الطلبات لم تُحمّل بعد. انتظر قليلاً.","info");return;}
  var map={},order=[];
  for(var i=0;i<allOrders.length;i++){
    var d=allOrders[i].data||{};
    if(isExcluded(d))continue;
    if(!isPositiveStatusAdmin(statusKey(d)))continue;
    var ph=rbPhoneE164(orderPhone(d));if(!ph)continue;
    var nm=String(customerName(d)||"").trim();
    var parts=nm.split(/\s+/).filter(Boolean);
    var fn=(parts.shift()||"").toLowerCase();
    var ln=parts.join(" ").toLowerCase();
    var em=String(d.email||"").trim().toLowerCase();
    if(em.indexOf("@")<1)em="";
    if(!map[ph]){map[ph]={phone:ph,email:em,fn:fn,ln:ln,ct:String(d.baladiya||d.commune||"").trim().toLowerCase(),st:String(d.wilaya||"").trim().toLowerCase(),value:0};order.push(ph);}
    map[ph].value+=Number(d.totalPrice||0)||0;
    if(!map[ph].fn&&fn)map[ph].fn=fn;
    if(!map[ph].email&&em)map[ph].email=em;
  }
  if(!order.length){rbToast("لا يوجد زبائن مؤكّدون للتصدير.","info");return;}
  function q(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}
  var csv="email,phone,fn,ln,ct,st,country,value\n";
  for(var j=0;j<order.length;j++){var r=map[order[j]];csv+=[q(r.email),q(r.phone),q(r.fn),q(r.ln),q(r.ct),q(r.st),q("dz"),q(r.value)].join(",")+"\n";}
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="robuste-meta-customers-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){try{URL.revokeObjectURL(a.href);a.parentNode.removeChild(a);}catch(e){}},1500);
  rbToast("✅ تم تصدير "+order.length+" زبون.\nارفعه في: Meta → Audiences → Customer list.","ok",16000);
}
window.rbBulkSendMeta=rbBulkSendMeta;window.rbExportMetaCsv=rbExportMetaCsv;
function patchOrder(id,patch){patch.updatedAt=new Date().toISOString();return db.collection('orders').doc(id).update(patch).then(function(){var r=getRec(id);if(r)Object.assign(r.data,patch);try{if(patch&&patch.status&&isPositiveStatusAdmin(patch.status))fireWorkerPurchase(id);}catch(e){}});}
/* Add a phone + IP to config/watchlist so future orders from them are auto-flagged. */
function blockCustomer(phone,ip){var u={};if(phone)u.phones=firebase.firestore.FieldValue.arrayUnion(phone);if(ip)u.ips=firebase.firestore.FieldValue.arrayUnion(ip);if(!u.phones&&!u.ips)return Promise.resolve();return db.collection('config').doc('watchlist').set(u,{merge:true});}

/* ============ init ============ */
function boot(){
  try{
    initFirebase();
    $("loginBtn").addEventListener('click',tryLogin);
    $("adminPass").addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    $("adminEmail").addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    $("logoutBtn").addEventListener('click',logout);
    $("refreshBtn").addEventListener('click',function(){if(ordersLoaded){ordersLoaded=false;loadCostOverrides().then(loadOrders);}});
    if($("metaBulkBtn"))$("metaBulkBtn").addEventListener('click',function(){rbBulkSendMeta();});
    if($("metaCsvBtn"))$("metaCsvBtn").addEventListener('click',function(){rbExportMetaCsv();});
    var mt=$("menuToggle");if(mt)mt.addEventListener('click',function(){$("sidebar").classList.toggle('open');});
    var items=document.querySelectorAll('.nav-item2');for(var i=0;i<items.length;i++)items[i].addEventListener('click',function(){showSection(this.getAttribute('data-sec'));});
    if(auth)auth.onAuthStateChanged(onAuth);
  }catch(e){var le=document.getElementById('loginError');if(le){le.style.display='block';le.textContent='\u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u062a\u0634\u063a\u064a\u0644: '+((e&&e.message)||e);}}
}
try{window.tryLogin=tryLogin;window.__boot=boot;}catch(_){}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}

})();
</script>
