<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة إدارة الطلبات | ROBUSTE</title>

<!-- Bootstrap RTL + Icons (same CDNs already used by the site) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Firebase (same compat SDK version as the rest of the site) + Auth -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  :root { --brand:#ff6b00; --brand-dark:#e85d00; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f5f6f8; }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink); margin:0; }

  #loginGate { position:fixed; inset:0; background:linear-gradient(135deg,#1f2937,#374151); display:flex; align-items:center; justify-content:center; z-index:2000; }
  #loginGate .card { width:min(92vw,400px); border:none; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  #loginGate .brand-dot { width:54px;height:54px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem; }

  .navbar-admin { background:#fff; border-bottom:1px solid var(--line); }
  .navbar-admin .logo { font-weight:800; color:var(--brand); letter-spacing:.5px; }

  .stat-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; height:100%; transition:transform .15s ease, box-shadow .15s ease; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.06); }
  .stat-card .label { color:var(--muted); font-size:.85rem; font-weight:600; }
  .stat-card .value { font-size:1.7rem; font-weight:800; margin-top:4px; }
  .stat-icon { width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem; }

  .toolbar { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; }

  .table-wrap { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  table.orders { width:100%; border-collapse:collapse; }
  table.orders th { background:#fafbfc; font-size:.82rem; color:var(--muted); text-align:right; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.orders td { padding:12px 14px; border-bottom:1px solid #f1f2f4; font-size:.9rem; vertical-align:middle; }
  table.orders tr:last-child td { border-bottom:none; }
  table.orders tbody tr { cursor:pointer; transition:background .12s ease; }
  table.orders tbody tr:hover { background:#fff8f2; }
  .order-id { font-family:monospace; font-size:.8rem; color:var(--muted); }

  .badge-status { font-size:.78rem; font-weight:700; padding:.4em .7em; border-radius:999px; white-space:nowrap; }
  .s-new { background:#e0f2fe; color:#0369a1; }
  .s-confirmed { background:#ede9fe; color:#6d28d9; }
  .s-preparing { background:#fef3c7; color:#b45309; }
  .s-delivered { background:#dcfce7; color:#15803d; }
  .s-cancelled { background:#fee2e2; color:#b91c1c; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state i { font-size:3rem; opacity:.4; }

  .prod-line { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f1f2f4; }
  .prod-line img { width:46px;height:46px;object-fit:cover;border-radius:8px;background:#f1f2f4; }
  .prod-line:last-child { border-bottom:none; }

  .info-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #eef0f2; font-size:.92rem; }
  .info-row:last-child { border-bottom:none; }
  .info-row .k { color:var(--muted); }
  .info-row .v { font-weight:700; }

  .btn-brand { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn-brand:hover { background:var(--brand-dark); border-color:var(--brand-dark); color:#fff; }

  .spin-wrap { padding:60px; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<!-- ===================== LOGIN GATE (Firebase Auth) ===================== -->
<div id="loginGate">
  <div class="card p-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="brand-dot"><i class="bi bi-shield-lock"></i></div>
      <div>
        <div class="fw-bold" style="font-size:1.1rem;">تسجيل دخول الإدارة</div>
        <div class="text-muted" style="font-size:.85rem;">ROBUSTE · إدارة الطلبات</div>
      </div>
    </div>
    <label class="form-label fw-semibold">البريد الإلكتروني</label>
    <input type="email" id="adminEmail" class="form-control form-control-lg mb-2" dir="ltr" placeholder="admin@example.com" autocomplete="username">
    <label class="form-label fw-semibold">كلمة المرور</label>
    <input type="password" id="adminPass" class="form-control form-control-lg" placeholder="••••••••" autocomplete="current-password">
    <div id="loginError" class="text-danger mt-2" style="font-size:.85rem; display:none;"></div>
    <button id="loginBtn" class="btn btn-brand btn-lg w-100 mt-3"><i class="bi bi-box-arrow-in-left"></i> دخول</button>
    <p class="text-muted mt-3 mb-0" style="font-size:.72rem; line-height:1.5;">يتم التحقق عبر Firebase Authentication. فقط الحسابات المصرّح لها يمكنها عرض الطلبات.</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" style="display:none;">

  <nav class="navbar navbar-admin py-3">
    <div class="container-xl d-flex justify-content-between align-items-center">
      <span class="logo fs-5"><i class="bi bi-box-seam"></i> ROBUSTE · لوحة الطلبات</span>
      <div class="d-flex gap-2 align-items-center">
        <span id="adminWho" class="text-muted d-none d-md-inline" style="font-size:.82rem;" dir="ltr"></span>
        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> تحديث</button>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> خروج</button>
      </div>
    </div>
  </nav>

  <div class="container-xl py-4">

    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex align-items-center gap-3">
          <div class="stat-icon" style="background:#eef2ff;color:#4338ca;"><i class="bi bi-receipt"></i></div>
          <div><div class="label">إجمالي الطلبات</div><div class="value" id="statTotal">—</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex align-items-center gap-3">
          <div class="stat-icon" style="background:#e0f2fe;color:#0369a1;"><i class="bi bi-bell"></i></div>
          <div><div class="label">طلبات جديدة</div><div class="value" id="statNew">—</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex align-items-center gap-3">
          <div class="stat-icon" style="background:#dcfce7;color:#15803d;"><i class="bi bi-check2-circle"></i></div>
          <div><div class="label">تم التسليم</div><div class="value" id="statDelivered">—</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex align-items-center gap-3">
          <div class="stat-icon" style="background:#fff7ed;color:#c2410c;"><i class="bi bi-cash-coin"></i></div>
          <div><div class="label">الإيراد التقديري</div><div class="value" id="statRevenue">—</div></div>
        </div>
      </div>
    </div>

    <div class="toolbar mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-lg-4">
          <label class="form-label mb-1" style="font-size:.82rem;"><i class="bi bi-search"></i> بحث (الاسم / الهاتف / رقم الطلب)</label>
          <input type="text" id="searchInput" class="form-control" placeholder="ابحث...">
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label mb-1" style="font-size:.82rem;">الحالة</label>
          <select id="statusFilter" class="form-select">
            <option value="">الكل</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label mb-1" style="font-size:.82rem;">من تاريخ</label>
          <input type="date" id="dateFrom" class="form-control">
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label mb-1" style="font-size:.82rem;">إلى تاريخ</label>
          <input type="date" id="dateTo" class="form-control">
        </div>
        <div class="col-6 col-lg-2">
          <button id="clearFilters" class="btn btn-outline-secondary w-100"><i class="bi bi-x-circle"></i> مسح</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <div id="tableContent">
        <div class="spin-wrap"><div class="spinner-border text-warning" role="status"></div><div class="mt-2">جاري تحميل الطلبات...</div></div>
      </div>
    </div>
    <div id="resultCount" class="text-muted mt-2" style="font-size:.85rem;"></div>

  </div>
</div>

<!-- ===================== ORDER DETAILS MODAL ===================== -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:16px; border:none;">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-receipt-cutoff"></i> تفاصيل الطلب</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  'use strict';

  /* =========================================================
     CONFIG — same Firebase project as the storefront.
     Login now uses Firebase Authentication (Email/Password).
     ========================================================= */
  var firebaseConfig = {
    apiKey: "AIzaSyBTrnKCYOtfSSDYtmVQbzP2HcwgkLT565Y",
    authDomain: "robuste-c8e0f.firebaseapp.com",
    projectId: "robuste-c8e0f",
    storageBucket: "robuste-c8e0f.appspot.com",
    messagingSenderId: "975609984963",
    appId: "1:975609984963:web:a481efb493a88d7bc7af76"
  };

  /* ===== Status model (Arabic, matching existing data) ===== */
  var STATUSES = [
    { key: "جديد",          css: "s-new" },
    { key: "مؤكد",          css: "s-confirmed" },
    { key: "قيد التحضير", css: "s-preparing" },
    { key: "تم التسليم",    css: "s-delivered" },
    { key: "ملغى",          css: "s-cancelled" }
  ];
  var DEFAULT_STATUS = "جديد";

  function statusMeta(raw){
    var s = (raw == null || String(raw).trim() === "") ? DEFAULT_STATUS : String(raw).trim();
    for (var i=0;i<STATUSES.length;i++){ if (STATUSES[i].key === s) return STATUSES[i]; }
    return { key: s, css: "s-new" };
  }

  /* ===== State ===== */
  var auth = null, db = null;
  var allOrders = [];
  var modalInstance = null;
  var ordersLoaded = false;

  /* ===== Helpers ===== */
  function $(id){ return document.getElementById(id); }
  function esc(v){
    if (v == null) return "";
    return String(v).replace(/[&<>\"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"})[c];
    });
  }
  function fmtMoney(n){
    var num = Number(n);
    if (!isFinite(num)) num = 0;
    return num.toLocaleString('ar-DZ') + " د.ج";
  }
  function parseDate(ts){
    if (!ts) return null;
    try {
      if (typeof ts === 'string') { var d = new Date(ts); return isNaN(d.getTime()) ? null : d; }
      if (typeof ts === 'object'){
        if (typeof ts.toDate === 'function') return ts.toDate();
        if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
      }
    } catch(e){}
    return null;
  }
  function fmtDate(d){
    if (!d) return "—";
    try { return d.toLocaleString('ar-DZ', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return d.toISOString(); }
  }
  function customerName(data){ return data.customer || data.customerName || data.fullName || data.name || "—"; }
  function orderTotal(data){
    if (data.totalPrice != null) return Number(data.totalPrice) || 0;
    if (data.total != null) return Number(data.total) || 0;
    var arr = Array.isArray(data.products) ? data.products : [];
    var t = 0; for (var i=0;i<arr.length;i++){ t += (Number(arr[i].price)||0) * (Number(arr[i].quantity)||0); }
    return t;
  }

  /* ===== Firebase init (runs immediately) ===== */
  function initFirebase(){
    if (typeof firebase === 'undefined' || !firebase.initializeApp){
      showLoginError("تعذر تحميل Firebase. تحقق من اتصال الإنترنت.");
      return false;
    }
    try {
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      return true;
    } catch(e){
      console.error('Firebase init error', e);
      showLoginError("خطأ في تهيئة Firebase.");
      return false;
    }
  }

  /* ===== Auth ===== */
  function showLoginError(msg){
    var el = $("loginError");
    el.innerHTML = '<i class="bi bi-exclamation-circle"></i> ' + esc(msg);
    el.style.display = 'block';
  }
  function tryLogin(){
    if (!auth) { if (!initFirebase()) return; }
    var email = ($("adminEmail").value || "").trim();
    var pass = $("adminPass").value;
    if (!email || !pass){ showLoginError("أدخل البريد وكلمة المرور."); return; }
    $("loginError").style.display = 'none';
    var btn = $("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> جاري الدخول...';
    auth.signInWithEmailAndPassword(email, pass)
      .catch(function(err){
        console.error('Auth error', err);
        var map = {
          'auth/invalid-email': "البريد الإلكتروني غير صالح.",
          'auth/user-not-found': "لا يوجد حساب بهذا البريد.",
          'auth/wrong-password': "كلمة المرور غير صحيحة.",
          'auth/invalid-credential': "بيانات الدخول غير صحيحة.",
          'auth/too-many-requests': "محاولات كثيرة. حاول لاحقاً."
        };
        showLoginError(map[err && err.code] || "تعذر تسجيل الدخول. تحقق من بياناتك.");
      })
      .finally(function(){
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-left"></i> دخول';
      });
  }
  function logout(){ if (auth) auth.signOut(); }

  function onAuth(user){
    if (user){
      $("loginGate").style.display = 'none';
      $("app").style.display = 'block';
      var who = $("adminWho"); if (who) who.textContent = user.email || '';
      if (!ordersLoaded){ buildStatusFilter(); loadOrders(); }
    } else {
      ordersLoaded = false;
      $("app").style.display = 'none';
      $("loginGate").style.display = 'flex';
      var p = $("adminPass"); if (p) p.value = '';
    }
  }

  function buildStatusFilter(){
    var sel = $("statusFilter");
    if (sel.options.length > 1) return; // already built
    STATUSES.forEach(function(s){
      var o = document.createElement('option');
      o.value = s.key; o.textContent = s.key;
      sel.appendChild(o);
    });
  }

  /* ===== Load orders ===== */
  function loadOrders(){
    $("tableContent").innerHTML = '<div class="spin-wrap"><div class="spinner-border text-warning" role="status"></div><div class="mt-2">جاري تحميل الطلبات...</div></div>';
    db.collection('orders').get()
      .then(function(snap){
        ordersLoaded = true;
        allOrders = [];
        snap.forEach(function(doc){ allOrders.push({ id: doc.id, data: doc.data() || {} }); });
        allOrders.sort(function(a,b){
          var da = parseDate(a.data.timestamp), dbb = parseDate(b.data.timestamp);
          if (da && dbb) return dbb - da;
          if (da) return -1; if (dbb) return 1; return 0;
        });
        renderStats();
        applyFilters();
      })
      .catch(function(err){
        console.error('Load error', err);
        var msg = (err && err.code === 'permission-denied')
          ? "لا توجد صلاحية لقراءة الطلبات. تأكد من نشر قواعد Firestore وأن حسابك مسجّل الدخول."
          : "تعذر تحميل الطلبات. حاول مجدداً.";
        showTableError(msg);
      });
  }

  function showTableError(msg){
    $("tableContent").innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><div class="mt-3 fw-semibold">'+esc(msg)+'</div></div>';
    $("resultCount").textContent = "";
  }

  /* ===== Analytics ===== */
  function renderStats(){
    var total = allOrders.length;
    var nNew = 0, nDelivered = 0, revenue = 0;
    allOrders.forEach(function(o){
      var st = statusMeta(o.data.status).key;
      if (st === "جديد") nNew++;
      if (st === "تم التسليم") nDelivered++;
      if (st !== "ملغى") revenue += orderTotal(o.data);
    });
    $("statTotal").textContent = total.toLocaleString('ar-DZ');
    $("statNew").textContent = nNew.toLocaleString('ar-DZ');
    $("statDelivered").textContent = nDelivered.toLocaleString('ar-DZ');
    $("statRevenue").textContent = fmtMoney(revenue);
  }

  /* ===== Filtering + search ===== */
  function applyFilters(){
    var q = ($("searchInput").value || "").trim().toLowerCase();
    var statusF = $("statusFilter").value;
    var fromV = $("dateFrom").value;
    var toV = $("dateTo").value;
    var from = fromV ? new Date(fromV + "T00:00:00") : null;
    var to = toV ? new Date(toV + "T23:59:59") : null;

    var rows = allOrders.filter(function(o){
      var d = o.data;
      if (statusF && statusMeta(d.status).key !== statusF) return false;
      var dt = parseDate(d.timestamp);
      if (from && (!dt || dt < from)) return false;
      if (to && (!dt || dt > to)) return false;
      if (q){
        var hay = (customerName(d) + " " + (d.phone||"") + " " + o.id).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    renderTable(rows);
  }

  /* ===== Table render ===== */
  function renderTable(rows){
    if (!rows.length){
      $("tableContent").innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i><div class="mt-3">لا توجد طلبات مطابقة.</div></div>';
      $("resultCount").textContent = "0 طلب";
      return;
    }
    var html = '<table class="orders"><thead><tr>'
      + '<th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>التاريخ</th><th>الحالة</th>'
      + '</tr></thead><tbody>';
    rows.forEach(function(o){
      var d = o.data;
      var sm = statusMeta(d.status);
      html += '<tr data-id="'+esc(o.id)+'">'
        + '<td><span class="order-id">'+esc(o.id)+'</span></td>'
        + '<td>'+esc(customerName(d))+'</td>'
        + '<td dir="ltr" style="text-align:right;">'+esc(d.phone||"—")+'</td>'
        + '<td>'+esc(fmtMoney(orderTotal(d)))+'</td>'
        + '<td>'+esc(fmtDate(parseDate(d.timestamp)))+'</td>'
        + '<td><span class="badge-status '+sm.css+'">'+esc(sm.key)+'</span></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    $("tableContent").innerHTML = html;
    $("resultCount").textContent = rows.length.toLocaleString('ar-DZ') + " طلب";

    var trs = $("tableContent").querySelectorAll('tbody tr');
    for (var i=0;i<trs.length;i++){
      trs[i].addEventListener('click', function(){ openOrder(this.getAttribute('data-id')); });
    }
  }

  /* ===== Order details modal ===== */
  function openOrder(id){
    var rec = null;
    for (var i=0;i<allOrders.length;i++){ if (allOrders[i].id === id){ rec = allOrders[i]; break; } }
    if (!rec) return;
    var d = rec.data;
    var sm = statusMeta(d.status);

    var products = Array.isArray(d.products) ? d.products : [];
    var prodHtml = '';
    if (products.length){
      products.forEach(function(p){
        var name = p.name || p.title || "منتج";
        var qty = (p.quantity != null) ? p.quantity : 1;
        var price = Number(p.price)||0;
        prodHtml += '<div class="prod-line">'
          + (p.image ? '<img src="'+esc(p.image)+'" alt="" onerror="this.style.visibility=&#39;hidden&#39;">' : '<div style="width:46px;height:46px;border-radius:8px;background:#f1f2f4;"></div>')
          + '<div class="flex-grow-1"><div class="fw-semibold">'+esc(name)+'</div>'
          + '<div class="text-muted" style="font-size:.82rem;">'+fmtMoney(price)+' × '+esc(qty)+'</div></div>'
          + '<div class="fw-bold">'+fmtMoney(price*(Number(qty)||0))+'</div>'
          + '</div>';
      });
    } else {
      prodHtml = '<div class="text-muted">لا توجد منتجات مسجلة لهذا الطلب.</div>';
    }

    var statusBtns = STATUSES.map(function(s){
      var active = (s.key === sm.key);
      return '<button class="btn btn-sm '+(active?'btn-brand':'btn-outline-secondary')+' status-set-btn" data-status="'+esc(s.key)+'">'+esc(s.key)+'</button>';
    }).join(' ');

    var body = ''
      + '<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">'
      +   '<span class="order-id">#'+esc(id)+'</span>'
      +   '<span class="badge-status '+sm.css+'" id="modalCurrentStatus">'+esc(sm.key)+'</span>'
      + '</div>'
      + '<h6 class="fw-bold mb-2"><i class="bi bi-person"></i> بيانات العميل</h6>'
      + '<div class="mb-3">'
      +   '<div class="info-row"><span class="k">الاسم</span><span class="v">'+esc(customerName(d))+'</span></div>'
      +   '<div class="info-row"><span class="k">الهاتف</span><span class="v" dir="ltr">'+esc(d.phone||"—")+'</span></div>'
      +   (d.email ? '<div class="info-row"><span class="k">البريد</span><span class="v" dir="ltr">'+esc(d.email)+'</span></div>' : '')
      +   '<div class="info-row"><span class="k">الولاية</span><span class="v">'+esc(d.wilaya||"—")+'</span></div>'
      +   '<div class="info-row"><span class="k">العنوان</span><span class="v">'+esc(d.address||"—")+'</span></div>'
      +   (d.payment ? '<div class="info-row"><span class="k">الدفع</span><span class="v">'+esc(d.payment)+'</span></div>' : '')
      +   '<div class="info-row"><span class="k">التاريخ</span><span class="v">'+esc(fmtDate(parseDate(d.timestamp)))+'</span></div>'
      + '</div>'
      + '<h6 class="fw-bold mb-2"><i class="bi bi-bag"></i> المنتجات</h6>'
      + '<div class="mb-2">'+prodHtml+'</div>'
      + '<div class="info-row" style="font-size:1.05rem;"><span class="k fw-bold">الإجمالي</span><span class="v">'+fmtMoney(orderTotal(d))+'</span></div>'
      + '<hr>'
      + '<h6 class="fw-bold mb-2"><i class="bi bi-arrow-repeat"></i> تغيير الحالة</h6>'
      + '<div class="d-flex flex-wrap gap-2" id="statusBtns">'+statusBtns+'</div>'
      + '<div id="statusMsg" class="mt-2" style="font-size:.85rem;"></div>';

    $("modalBody").innerHTML = body;

    var btns = $("statusBtns").querySelectorAll('.status-set-btn');
    for (var i=0;i<btns.length;i++){
      btns[i].addEventListener('click', function(){
        updateStatus(id, this.getAttribute('data-status'));
      });
    }

    if (!modalInstance) modalInstance = new bootstrap.Modal($("orderModal"));
    modalInstance.show();
  }

  /* ===== Update status in Firestore (only the status field) ===== */
  function updateStatus(id, newStatus){
    var msg = $("statusMsg");
    msg.innerHTML = '<span class="text-muted"><span class="spinner-border spinner-border-sm"></span> جاري الحفظ...</span>';
    var btns = $("statusBtns").querySelectorAll('.status-set-btn');
    for (var i=0;i<btns.length;i++) btns[i].disabled = true;

    db.collection('orders').doc(id).update({ status: newStatus })
      .then(function(){
        for (var i=0;i<allOrders.length;i++){ if (allOrders[i].id === id){ allOrders[i].data.status = newStatus; break; } }
        var sm = statusMeta(newStatus);
        var cur = $("modalCurrentStatus");
        if (cur){ cur.className = 'badge-status ' + sm.css; cur.textContent = sm.key; }
        for (var j=0;j<btns.length;j++){
          var bs = btns[j].getAttribute('data-status');
          btns[j].className = 'btn btn-sm ' + (bs === newStatus ? 'btn-brand' : 'btn-outline-secondary') + ' status-set-btn';
          btns[j].disabled = false;
        }
        msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> تم تحديث الحالة</span>';
        renderStats();
        applyFilters();
      })
      .catch(function(err){
        console.error('Update error', err);
        for (var k=0;k<btns.length;k++) btns[k].disabled = false;
        var t = (err && err.code === 'permission-denied')
          ? "لا توجد صلاحية لتحديث الطلب (قواعد Firestore)."
          : "تعذر حفظ الحالة. حاول مجدداً.";
        msg.innerHTML = '<span class="text-danger"><i class="bi bi-exclamation-circle"></i> '+esc(t)+'</span>';
      });
  }

  /* ===== Wire up events ===== */
  document.addEventListener('DOMContentLoaded', function(){
    initFirebase();
    if (auth){ auth.onAuthStateChanged(onAuth); }

    $("loginBtn").addEventListener('click', tryLogin);
    $("adminPass").addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
    $("adminEmail").addEventListener('keydown', function(e){ if (e.key === 'Enter') $("adminPass").focus(); });
    $("logoutBtn").addEventListener('click', logout);
    $("refreshBtn").addEventListener('click', loadOrders);
    $("searchInput").addEventListener('input', applyFilters);
    $("statusFilter").addEventListener('change', applyFilters);
    $("dateFrom").addEventListener('change', applyFilters);
    $("dateTo").addEventListener('change', applyFilters);
    $("clearFilters").addEventListener('click', function(){
      $("searchInput").value = ''; $("statusFilter").value = '';
      $("dateFrom").value = ''; $("dateTo").value = '';
      applyFilters();
    });
  });

})();
</script>
</body>
</html>
