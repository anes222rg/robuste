<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>ROBUSTE — إدارة الشحن</title>
<style>
  :root{ --primary:#FF6B35; --ink:#1f2330; --muted:#6b7280; --bg:#f4f5f7; --card:#fff; --line:#e6e7ea; --ok:#2e7d32; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }
  h1{ font-size:1.3rem; margin:14px 0 4px; color:var(--primary); }
  .sub{ color:var(--muted); font-size:.88rem; margin-bottom:14px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label{ display:block; font-weight:700; font-size:.85rem; margin:0 0 6px; }
  input,select{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:1rem; }
  input:focus,select:focus{ outline:none; border-color:var(--primary); }
  .row{ display:flex; gap:10px; align-items:end; }
  .row > div{ flex:1; }
  button{ background:var(--primary); color:#fff; border:0; border-radius:10px; padding:11px 18px; font-weight:800; cursor:pointer; white-space:nowrap; }
  button.sec{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  button:disabled{ opacity:.55; cursor:default; }
  .order{ border:1px solid var(--line); border-radius:12px; padding:13px; margin-top:12px; }
  .order h3{ margin:0 0 2px; font-size:1rem; }
  .meta{ color:var(--muted); font-size:.84rem; margin-bottom:10px; }
  .cur{ font-size:.82rem; margin-bottom:8px; }
  .cur b{ color:var(--ink); }
  .tag{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:.78rem; font-weight:700; background:#fff1e8; color:var(--primary); }
  .tag.has{ background:#e9f6ea; color:var(--ok); }
  .grid{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .grid > div{ flex:1; min-width:150px; }
  .saved{ color:var(--ok); font-weight:700; font-size:.85rem; }
  .msg{ color:var(--muted); padding:14px 4px; }
  .err{ color:#c62828; }
  .keybar{ display:flex; gap:10px; align-items:center; }
  .small{ font-size:.78rem; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ROBUSTE — إدارة الشحن</h1>
  <div class="sub">ابحث عن طلب برقم الهاتف، أضف رقم الشحنة (Ecotrack) وحدّث الحالة. صفحة خاصة بالمالك — لا تنشرها.</div>

  <div class="panel">
    <label for="key">مفتاح الإدارة (ADMIN_KEY)</label>
    <div class="keybar">
      <input type="password" id="key" placeholder="ألصق المفتاح هنا" />
      <button class="sec" id="saveKey" type="button">حفظ</button>
    </div>
    <div class="small">يُحفظ محليًّا في هذا المتصفح فقط (localStorage).</div>
  </div>

  <div class="panel">
    <label for="phone">رقم الهاتف</label>
    <div class="row">
      <div><input type="tel" id="phone" inputmode="numeric" maxlength="10" placeholder="05XXXXXXXX" style="direction:ltr;text-align:left" /></div>
      <button id="search" type="button">بحث</button>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
  var WORKER = (window.ROBUSTE_WORKER_URL || "https://robuste.aneslaidaoui06.workers.dev").replace(/\/+$/, "");
  var PHONE_RE = /^0[5-7][0-9]{8}$/;
  var STATUSES = ["\u062c\u062f\u064a\u062f", "\u062a\u0645 \u0627\u0644\u062a\u0623\u0643\u064a\u062f", "\u0642\u064a\u062f \u0627\u0644\u062a\u062d\u0636\u064a\u0631", "\u0645\u0644\u063a\u0649"];

  var keyInput = document.getElementById("key");
  var out = document.getElementById("out");
  keyInput.value = localStorage.getItem("ROBUSTE_ADMIN_KEY") || "";
  document.getElementById("saveKey").onclick = function(){ localStorage.setItem("ROBUSTE_ADMIN_KEY", keyInput.value.trim()); flash("\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0645\u0641\u062a\u0627\u062d"); };
  document.getElementById("phone").addEventListener("input", function(){ this.value = this.value.replace(/[^0-9]/g, "").slice(0,10); });
  document.getElementById("search").onclick = search;

  function key(){ return localStorage.getItem("ROBUSTE_ADMIN_KEY") || keyInput.value.trim(); }
  function flash(t){ var d=document.createElement("div"); d.className="saved"; d.textContent=t; out.prepend(d); setTimeout(function(){ d.remove(); }, 2500); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function search(){
    var phone = document.getElementById("phone").value.trim();
    if (!key()) { out.innerHTML = '<div class="msg err">\u0623\u062f\u062e\u0644 \u0645\u0641\u062a\u0627\u062d \u0627\u0644\u0625\u062f\u0627\u0631\u0629 \u0623\u0648\u0644\u0627\u064b.</div>'; return; }
    if (!PHONE_RE.test(phone)) { out.innerHTML = '<div class="msg err">\u0631\u0642\u0645 \u0647\u0627\u062a\u0641 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d.</div>'; return; }
    out.innerHTML = '<div class="msg">\u062c\u0627\u0631\u064d \u0627\u0644\u0628\u062d\u062b\u2026</div>';
    fetch(WORKER + "/admin/orders?phone=" + encodeURIComponent(phone), { headers: { "X-Admin-Key": key() } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (res.ok === false || !res.j || res.j.error) { out.innerHTML = '<div class="msg err">'+esc((res.j&&res.j.error)||"\u062e\u0637\u0623")+(res.j&&res.j.detail?(" \u2014 "+esc(res.j.detail)):"")+'</div>'; return; }
        var orders = res.j.orders || [];
        if (!orders.length) { out.innerHTML = '<div class="msg">\u0644\u0627 \u062a\u0648\u062c\u062f \u0637\u0644\u0628\u0627\u062a.</div>'; return; }
        out.innerHTML = ""; orders.forEach(renderOrder);
      })
      .catch(function(e){ out.innerHTML = '<div class="msg err">\u062e\u0637\u0623 \u0627\u062a\u0635\u0627\u0644: '+esc(String(e))+'</div>'; });
  }

  function renderOrder(o){
    var box = document.createElement("div");
    box.className = "order";
    var opts = STATUSES.map(function(s){ return '<option value="'+esc(s)+'"'+(s===o.status?" selected":"")+'>'+esc(s)+'</option>'; }).join("");
    box.innerHTML =
      '<h3>\u0637\u0644\u0628 #'+esc(o.ref)+' \u00b7 '+esc(o.customer||"")+'</h3>' +
      '<div class="meta">'+esc(o.phone)+' \u00b7 '+esc(o.wilaya)+' \u00b7 '+(o.productCount||0)+' \u0645\u0646\u062a\u062c \u00b7 '+Number(o.total||0).toLocaleString()+' \u062f\u062c</div>' +
      '<div class="cur">\u0627\u0644\u062d\u0627\u0644\u0629: <b>'+esc(o.status||"\u2014")+'</b> \u00b7 \u0631\u0642\u0645 \u0627\u0644\u0634\u062d\u0646\u0629: '+(o.ecotrackTracking?('<span class="tag has">'+esc(o.ecotrackTracking)+'</span>'):'<span class="tag">\u0644\u0627 \u064a\u0648\u062c\u062f</span>')+'</div>' +
      '<div class="grid">' +
        '<div><label>\u0631\u0642\u0645 \u0627\u0644\u0634\u062d\u0646\u0629 (Ecotrack)</label><input type="text" class="f-track" style="direction:ltr;text-align:left" value="'+esc(o.ecotrackTracking||"")+'" placeholder="\u0645\u062b\u0627\u0644: ABC123456" /></div>' +
        '<div style="max-width:190px"><label>\u0627\u0644\u062d\u0627\u0644\u0629</label><select class="f-status">'+opts+'</select></div>' +
        '<div style="flex:0 0 auto"><label>&nbsp;</label><button type="button" class="f-save">\u062d\u0641\u0638</button></div>' +
      '</div>';
    var btn = box.querySelector(".f-save");
    btn.onclick = function(){
      var tracking = box.querySelector(".f-track").value.trim();
      var status = box.querySelector(".f-status").value;
      btn.disabled = true; btn.textContent = "\u2026";
      fetch(WORKER + "/admin/set-tracking", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Key": key() },
        body: JSON.stringify({ id: o.id, tracking: tracking, status: status })
      }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){
          if (res.ok === false || (res.j && res.j.error)) { alert("\u062e\u0637\u0623: " + ((res.j&&res.j.error)||"") + (res.j&&res.j.detail?(" \u2014 "+res.j.detail):"")); }
          else { o.ecotrackTracking = tracking || null; o.status = status; flash("\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0637\u0644\u0628 #"+o.ref); var c=box.querySelector(".cur"); c.innerHTML = '\u0627\u0644\u062d\u0627\u0644\u0629: <b>'+esc(status)+'</b> \u00b7 \u0631\u0642\u0645 \u0627\u0644\u0634\u062d\u0646\u0629: '+(tracking?('<span class="tag has">'+esc(tracking)+'</span>'):'<span class="tag">\u0644\u0627 \u064a\u0648\u062c\u062f</span>'); }
        })
        .catch(function(e){ alert("\u062e\u0637\u0623 \u0627\u062a\u0635\u0627\u0644: " + e); })
        .finally(function(){ btn.disabled = false; btn.textContent = "\u062d\u0641\u0638"; });
    };
    out.appendChild(box);
  }
</script>
</body>
</html>
