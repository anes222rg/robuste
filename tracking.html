<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تتبع طلبي — ROBUSTE</title>
<style>
  :root{ --primary:#FF6B35; --ink:#1f2330; --muted:#6b7280; --bg:#f7f7f8; --card:#fff; --line:#ececf0; --ok:#2e7d32; --warn:#b26a00; --bad:#c62828; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:680px; margin:0 auto; padding:18px 16px 48px; }
  header{ text-align:center; padding:22px 0 8px; }
  header .logo{ font-size:1.9rem; font-weight:900; letter-spacing:1px; color:var(--primary); }
  header p{ margin:6px 0 0; color:var(--muted); font-size:.95rem; }
  .search{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; box-shadow:0 6px 24px rgba(0,0,0,.04); }
  label{ display:block; font-weight:700; font-size:.95rem; margin-bottom:8px; }
  .row{ display:flex; gap:10px; }
  input[type=tel]{ flex:1; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:1.05rem; direction:ltr; text-align:left; }
  input[type=tel]:focus{ outline:none; border-color:var(--primary); }
  button{ background:var(--primary); color:#fff; border:0; border-radius:12px; padding:0 22px; font-size:1rem; font-weight:800; cursor:pointer; transition:.15s; }
  button:hover{ filter:brightness(.95); }
  button:disabled{ opacity:.6; cursor:default; }
  .hint{ color:var(--muted); font-size:.82rem; margin-top:8px; }
  .msg{ text-align:center; padding:26px 10px; color:var(--muted); }
  .order{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; box-shadow:0 6px 24px rgba(0,0,0,.04); }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .ref{ font-size:.8rem; color:var(--muted); }
  .pill{ font-weight:800; font-size:.9rem; padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .pill.received,.pill.confirmed,.pill.preparing{ background:#fff1e8; color:var(--primary); }
  .pill.in_transit,.pill.out_for_delivery{ background:#fff7e0; color:var(--warn); }
  .pill.delivered{ background:#e9f6ea; color:var(--ok); }
  .pill.returned,.pill.cancelled{ background:#fdecec; color:var(--bad); }
  .meta{ display:flex; gap:16px; flex-wrap:wrap; margin:12px 0 4px; font-size:.9rem; color:var(--muted); }
  .meta b{ color:var(--ink); font-weight:700; }
  .steps{ display:flex; justify-content:space-between; margin:18px 4px 6px; position:relative; }
  .steps:before{ content:""; position:absolute; top:11px; right:8%; left:8%; height:3px; background:var(--line); }
  .step{ position:relative; z-index:1; text-align:center; flex:1; font-size:.72rem; color:var(--muted); }
  .step .dot{ width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--line); margin:0 auto 6px; }
  .step.done .dot{ background:var(--primary); border-color:var(--primary); }
  .step.done{ color:var(--ink); font-weight:700; }
  .timeline{ list-style:none; margin:14px 0 0; padding:12px 0 0; border-top:1px dashed var(--line); }
  .timeline li{ display:flex; gap:10px; padding:7px 0; font-size:.9rem; }
  .timeline .tdate{ color:var(--muted); min-width:120px; direction:ltr; text-align:left; font-size:.82rem; }
  .track-no{ font-size:.82rem; color:var(--muted); margin-top:10px; direction:ltr; text-align:left; }
  footer{ text-align:center; color:var(--muted); font-size:.8rem; margin-top:26px; }
  .spin{ display:inline-block; width:18px; height:18px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:r .8s linear infinite; vertical-align:-3px; }
  @keyframes r{ to{ transform:rotate(360deg); } }
</style>
<!-- UI refinement layer -->
<link rel="stylesheet" href="robuste-ui.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ROBUSTE</div>
    <p>تتبع حالة طلبك بإدخال رقم الهاتف الذي استعملته عند الطلب</p>
  </header>

  <form class="search" id="trackForm">
    <label for="phone">رقم الهاتف</label>
    <div class="row">
      <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="05XXXXXXXX / 06 / 07" maxlength="10" />
      <button type="submit" id="btn">تتبع</button>
    </div>
    <div class="hint">أدخل 10 أرقام تبدأ بـ 05 أو 06 أو 07.</div>
  </form>

  <div id="out"></div>

  <footer>ROBUSTE · الدفع عند الاستلام · توصيل لكل الولايات</footer>
</div>

<script>
  // Point this at your deployed Worker (no trailing slash). Falls back to window global.
  var WORKER = (window.ROBUSTE_WORKER_URL || "https://robuste.aneslaidaoui06.workers.dev").replace(/\/+$/, "");
  var PHONE_RE = /^0[5-7][0-9]{8}$/;
  var STAGES = ["received","confirmed","preparing","in_transit","out_for_delivery","delivered"];
  var STAGE_AR = { received:"\u0627\u0633\u062a\u0644\u0627\u0645", confirmed:"\u062a\u0623\u0643\u064a\u062f", preparing:"\u062a\u062d\u0636\u064a\u0631", in_transit:"\u0641\u064a \u0627\u0644\u0637\u0631\u064a\u0642", out_for_delivery:"\u0644\u0644\u062a\u0648\u0635\u064a\u0644", delivered:"\u062a\u0645 \u0627\u0644\u062a\u0633\u0644\u064a\u0645" };

  var form = document.getElementById("trackForm");
  var out = document.getElementById("out");
  var btn = document.getElementById("btn");
  var input = document.getElementById("phone");

  input.addEventListener("input", function(){ this.value = this.value.replace(/[^0-9]/g, "").slice(0,10); });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var phone = input.value.trim();
    if (!PHONE_RE.test(phone)) { out.innerHTML = msg("\u0631\u0642\u0645 \u0627\u0644\u0647\u0627\u062a\u0641 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d. \u0623\u062f\u062e\u0644 10 \u0623\u0631\u0642\u0627\u0645."); return; }
    lookup(phone);
  });

  function lookup(phone){
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    out.innerHTML = msg("\u062c\u0627\u0631\u064d \u0627\u0644\u0628\u062d\u062b\u2026");
    fetch(WORKER + "/track?phone=" + encodeURIComponent(phone), { method:"GET" })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) { out.innerHTML = msg("\u062a\u0639\u0630\u0651\u0631 \u062c\u0644\u0628 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a. \u062d\u0627\u0648\u0644 \u0644\u0627\u062d\u0642\u064b\u0627."); return; }
        var orders = (res.j && res.j.orders) || [];
        if (!orders.length) { out.innerHTML = msg("\u0644\u0627 \u062a\u0648\u062c\u062f \u0637\u0644\u0628\u0627\u062a \u0645\u0631\u062a\u0628\u0637\u0629 \u0628\u0647\u0630\u0627 \u0627\u0644\u0631\u0642\u0645. \u062a\u0623\u0643\u062f \u0645\u0646 \u0627\u0644\u0631\u0642\u0645 \u0623\u0648 \u062a\u0648\u0627\u0635\u0644 \u0645\u0639\u0646\u0627."); return; }
        out.innerHTML = orders.map(card).join("");
      })
      .catch(function(){ out.innerHTML = msg("\u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u0627\u062a\u0635\u0627\u0644. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a."); })
      .finally(function(){ btn.disabled = false; btn.textContent = "\u062a\u062a\u0628\u0639"; });
  }

  function card(o){
    var idx = STAGES.indexOf(o.stage); if (idx < 0) idx = 0;
    var cancelled = (o.stage === "cancelled" || o.stage === "returned");
    var steps = STAGES.map(function(s, i){
      return '<div class="step ' + (i <= idx && !cancelled ? "done" : "") + '"><div class="dot"></div>' + STAGE_AR[s] + '</div>';
    }).join("");
    var tl = (o.timeline || []).map(function(t){
      return '<li><span class="tdate">' + esc(fmtDate(t.date)) + '</span><span>' + esc(t.status) + '</span></li>';
    }).join("");
    return '<div class="order">' +
      '<div class="order-top">' +
        '<div><div style="font-weight:800;font-size:1.05rem">\u0637\u0644\u0628 #' + esc(o.ref) + '</div>' +
        '<div class="ref">' + esc(o.customerFirst || "") + (o.placedAt ? ' \u00b7 ' + esc(fmtDate(o.placedAt)) : "") + '</div></div>' +
        '<span class="pill ' + esc(o.stage) + '">' + esc(o.stageLabel || "") + '</span>' +
      '</div>' +
      '<div class="meta">' +
        '<span><b>' + (o.productCount || 0) + '</b> \u0645\u0646\u062a\u062c</span>' +
        (o.total ? '<span><b>' + Number(o.total).toLocaleString() + '</b> \u062f\u062c</span>' : "") +
        (o.wilaya ? '<span>\u0627\u0644\u0648\u0644\u0627\u064a\u0629: <b>' + esc(o.wilaya) + '</b></span>' : "") +
      '</div>' +
      (cancelled ? "" : '<div class="steps">' + steps + '</div>') +
      (tl ? '<ul class="timeline">' + tl + '</ul>' : "") +
      (o.tracking ? '<div class="track-no">\u0631\u0642\u0645 \u0627\u0644\u0634\u062d\u0646\u0629: ' + esc(o.tracking) + '</div>' : '<div class="track-no">\u0633\u064a\u0638\u0647\u0631 \u0631\u0642\u0645 \u0627\u0644\u0634\u062d\u0646\u0629 \u0628\u0639\u062f \u062a\u0623\u0643\u064a\u062f \u0627\u0644\u0637\u0644\u0628 \u0648\u062a\u0633\u0644\u064a\u0645\u0647 \u0644\u0634\u0631\u0643\u0629 \u0627\u0644\u062a\u0648\u0635\u064a\u0644.</div>') +
    '</div>';
  }

  function msg(t){ return '<div class="msg">' + esc(t) + '</div>'; }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmtDate(d){ if(!d) return ""; var t = new Date(d); if (isNaN(t)) return d; return t.toLocaleDateString("fr-DZ") + " " + t.toLocaleTimeString("fr-DZ",{hour:"2-digit",minute:"2-digit"}); }
</script>
</body>
</html>
