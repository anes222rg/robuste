:root {

    --light: #FFFFFF;
    --dark: #333333;
    --gray: #6C757D;
    --success: #28a745;
    --danger: #dc3545;
    --border-color: #e7e7e7;
    --shadow-color: rgba(0, 0, 0, 0.1);
    --radius-card: 12px;
    --transition: all 0.3s ease;
}

[data-theme="dark"] {
    --primary: #FF8C42;
    --primary-dark: #FF6B35;
    --secondary: #121212;
    --light: #1e1e1e;
    --dark: #f5f5f5;

.navbar-brand img { transition: transform 0.2s; }
.nav-link {

}
.nav-link::after {
    content: '';
    position: absolute;
    bottom: -5px;
    right: 50%;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    transition: width 0.3s ease;
    transform: translateX(50%);
    border-radius: 2px;
}
.nav-link:hover::after, .nav-link.active::after {

}

/* ========== زر تبديل الوضع (مثل index) ========== */
.theme-toggle {

    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--dark);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    font-size: 1.2rem;
}
[data-theme="light"] .theme-toggle {
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.1);
}
.theme-toggle:hover {
    background: var(--primary);
    color: white;
    transform: rotate(15deg) scale(1.1);
}

/* ========== زر السلة العائمة (مطابق لـ index) ========== */
.floating-cart {
    position: fixed;
    bottom: 100px;
    left: 20px;
    z-index: 1100;
    cursor: grab;
    user-select: none;
    touch-action: none;
}
.cart-btn-drag {
    width: 60px;
    height: 60px;
    border-radius: 50%;

    align-items: center;
    justify-content: center;

    box-shadow: 0 4px 12px var(--shadow-color);

}
.cart-btn-drag:hover {

}

/* ========== المنتجات المقترحة (كروت مثل index) ========== */
.related-card {

// إدارة السلة
let cart = [];
function loadCart() { try { const c = localStorage.getItem('robuste_cart'); if(c) cart = JSON.parse(c); } catch(e){} updateCartUI(); }
function saveCart() { try { localStorage.setItem('robuste_cart', JSON.stringify(cart)); } catch(e){} updateCartUI(); }
function updateCartUI() { 
    const totalItems = cart.reduce((s,i)=> s + (i.quantity||1), 0);
    document.getElementById('cartCountFloat').innerText = totalItems;
    renderCartItems();
}
function renderCartItems() {
    const container = document.getElementById('cartItemsList');
    if(!container) return;
    if(cart.length === 0) {
        container.innerHTML = `<div class="empty-cart-cta"><i class="bi bi-bag-x"></i><h5 class="mt-2">سلة التسوق فارغة</h5><p class="text-muted">استكشف منتجاتنا وأضف ما يناسبك</p><a href="index.html#products" class="btn btn-outline-modern mt-2" onclick="toggleCart()">تصفح المنتجات</a></div>`;
        document.getElementById('cartTotalAmount').innerText = '0 د.ج';
        return;
    }
    let html = ''; let total = 0;
    cart.forEach((item, idx) => {
        total += item.price * item.quantity;
        html += `<div class="cart-item d-flex gap-3">
            <img src="${item.image}" width="60" class="rounded-3">
            <div class="flex-grow-1">
                <h6 class="mb-1">${item.name}</h6>
                <div class="text-primary fw-bold">${item.price.toLocaleString()} د.ج</div>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${idx}, ${item.quantity-1})">-</button>
                    <span class="px-2">${item.quantity}</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${idx}, ${item.quantity+1})">+</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeCartItem(${idx})"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        </div>`;
    });
    container.innerHTML = html;
    document.getElementById('cartTotalAmount').innerText = `${total.toLocaleString()} د.ج`;
}
function updateQty(idx, newQty) { if(newQty<1) return removeCartItem(idx); cart[idx].quantity = newQty; saveCart(); }
function removeCartItem(idx) { cart.splice(idx,1); saveCart(); showToast("تم إزالة المنتج", "success"); }
function addToCart(name, price, img, id) {
    const existing = cart.find(i => i.id === id);
    if(existing) existing.quantity++;
    else cart.push({ id, name, price, image: img, quantity: 1 });
    saveCart();
    showToast(`✓ تم إضافة "${name.substring(0,30)}" إلى السلة`, "success");
}
function toggleCart() { new bootstrap.Offcanvas(document.getElementById('cartOffcanvas')).show(); }
function checkoutFromCart() {
    if(cart.length === 0) { showToast("السلة فارغة", "error"); return; }
    const first = cart[0];
    const totalCart = cart.reduce((s,i)=>s+i.price*i.quantity,0);
    document.getElementById('orderProductName').value = `${cart.length} منتج`;
    document.getElementById('orderProductPrice').value = totalCart;
    document.getElementById('modalProductTitle').innerText = `${cart.length} منتج مختلف`;
    document.getElementById('modalProductPrice').innerText = `${totalCart.toLocaleString()} د.ج`;
    document.getElementById('modalProductImg').src = first.image;
    new bootstrap.Modal(document.getElementById('orderModal')).show();
}

function showToast(msg, type) {
    const toastDiv = document.getElementById('statusToast');
    const bg = type === 'success' ? '#28a745' : '#dc3545';
    toastDiv.innerHTML = `<div class="alert shadow rounded-4 p-2 text-white" style="background:${bg};">${msg}</div>`;
    setTimeout(() => toastDiv.innerHTML = '', 2500);
}
let isSubmittingFinal = false;
async function submitOrderFinal() {
    if(isSubmittingFinal) return;
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const wilaya = document.getElementById('wilayaSelect').value;
    const address = document.getElementById('address').value;

// تحميل المنتج
const urlParams = new URLSearchParams(window.location.search);
const productId = parseInt(urlParams.get('pid'));
let currentProduct = null;
async function loadProduct() {
    if(!productId) { document.getElementById('productDetailRow').innerHTML = '<div class="col-12 text-center py-5"><i class="bi bi-exclamation-triangle fs-1"></i><h3>المنتج غير موجود</h3></div>'; return; }
    try {
        const res = await fetch('products.json');
        const products = await res.json();
        currentProduct = products.find(p => p.id === productId);
        if(!currentProduct) throw new Error();
        renderProductLayout(currentProduct);
        loadRelatedProducts(products, productId);
    } catch(e) { document.getElementById('productDetailRow').innerHTML = '<div class="col-12 text-center py-5"><h3>فشل تحميل المنتج</h3></div>'; }
}

    const discountHtml = discount ? `<span class="discount-badge ms-2">-${discount}%</span>` : '';

    const html = `
        <div class="col-lg-5 mb-4">
            <div class="main-image-wrapper"><img id="mainProductImg" src="${p.images[0]}" onclick="openLightbox(this.src)"></div>
            <div class="thumbnail-strip">${thumbHtml}</div>
        </div>
        <div class="col-lg-4 mb-4">
            <div class="product-info-card">
                <span class="badge bg-primary mb-2 px-3 py-2 rounded-pill">${p.badge || 'جديد'}</span>
                <h1 class="product-title">${p.title}</h1>
                <div class="price-block d-flex align-items-center justify-content-between">
                    <div><span class="current-price">${p.price.toLocaleString()} د.ج</span>${p.old_price ? `<span class="old-price me-2">${p.old_price.toLocaleString()} د.ج</span>` : ''}</div>
                    ${discountHtml}
                </div>
                <p class="mt-3">${p.description_short || 'منتج عالي الجودة من ROBUSTE'}</p>
                <ul class="feature-list">${featuresHtml}</ul>
                <div class="stock-status"><i class="bi bi-check-circle-fill text-success"></i> متوفر · توصيل سريع</div>
                <div class="action-buttons d-flex gap-3 mt-3">
                    <button class="btn btn-orange flex-grow-1" onclick="addToCart('${p.title.replace(/'/g, "\\'")}', ${p.price}, '${p.images[0]}', ${p.id})"><i class="bi bi-cart-plus"></i> أضف للسلة</button>
                    <button class="btn btn-outline-modern flex-grow-1" onclick="directBuy('${p.title.replace(/'/g, "\\'")}', ${p.price}, '${p.images[0]}', ${p.id})"><i class="bi bi-bag-check"></i> شراء فوري</button>
                </div>
            </div>
        </div>
        <div class="col-lg-3 mb-4">
            <div class="quick-order-card">
                <div class="quick-order-title">طلب سريع</div>
                <div class="product-mini"><img src="${p.images[0]}" width="50"><div><strong>${p.title.substring(0,35)}</strong><div class="text-primary fw-bold">${p.price} د.ج</div></div></div>
                <form id="expressForm">
                    <input type="text" id="expressName" class="form-control-premium mb-2" placeholder="الاسم الكامل *">
                    <input type="tel" id="expressPhone" class="form-control-premium mb-2" placeholder="رقم الهاتف *">
                    <select id="expressWilaya" class="form-select-premium mb-2">${wilayas.map(w=>`<option>${w}</option>`).join('')}</select>
                    <input type="number" id="expressQty" class="form-control-premium mb-2" value="1" min="1">
                    <button type="button" class="btn-submit-express" onclick="submitExpressOrder()">تأكيد الطلب</button>

}
function changeMainImage(src, el) {
    document.getElementById('mainProductImg').src = src;
    document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
}
function directBuy(name, price, img, id) { addToCart(name, price, img, id); checkoutFromCart(); }
let isSubmittingExpress = false;
async function submitExpressOrder() {
    if(isSubmittingExpress) return;
    if(!currentProduct) return;
    const name = document.getElementById('expressName').value.trim();
    const phone = document.getElementById('expressPhone').value.trim();
    const wilaya = document.getElementById('expressWilaya').value;
    const qty = parseInt(document.getElementById('expressQty').value) || 1;
    if(!name || !phone || !wilaya) { showToast("يرجى ملء البيانات", "error"); return; }
    if(!/^0[5-7][0-9]{8}$/.test(phone)) { showToast("رقم هاتف غير صحيح", "error"); return; }
    isSubmittingExpress = true;
    var expressBtn = document.querySelector('.btn-submit-express');
    var expressBtnOrig = expressBtn ? expressBtn.innerHTML : '';
    if(expressBtn){ expressBtn.disabled = true; expressBtn.innerHTML = 'جاري المعالجة...'; }
    const total = currentProduct.price * qty;
    try {
        const orderData = { products:[{ id:currentProduct.id, name:currentProduct.title, price:currentProduct.price, quantity:qty, image:currentProduct.images[0] }], customer:name, phone, wilaya, address:"", payment:"الدفع عند الاستلام", totalPrice:total, timestamp:new Date().toISOString() };
        const docRef = await db.collection('orders').add(orderData);
        await emailjs.send("service_lc1q5k8", "template_a15g7yg", { order_id:docRef.id, customer_name:name, customer_phone:phone, wilaya, total_price:total.toLocaleString(), products:`${currentProduct.title} x${qty}` });
        showOrderSuccess(docRef.id, phone, total);
        document.getElementById('expressForm').reset();
    } catch(e) { showToast("حدث خطأ", "error"); }
    finally { isSubmittingExpress = false; if(expressBtn){ expressBtn.disabled = false; expressBtn.innerHTML = expressBtnOrig; } }
}
function loadRelatedProducts(all, currentId) {
    const related = all.filter(p => p.id !== currentId).slice(0,4);
    if(!related.length) return;
    let html = `<h3 class="mb-4">قد يعجبك أيضاً</h3><div class="row g-4">`;
    related.forEach(p => {
        html += `<div class="col-md-3 col-6">
            <div class="related-card" onclick="goToProduct(${p.id})">
                <img src="${p.images[0]}">
                <div class="related-title">${p.title.substring(0,35)}</div>
                <div class="related-price">${p.price.toLocaleString()} د.ج</div>
                <button class="btn btn-orange w-100 mt-2" onclick="event.stopPropagation(); addToCart('${p.title.replace(/'/g, "\\'")}', ${p.price}, '${p.images[0]}', ${p.id})">أضف للسلة</button>
            </div>
        </div>`;
    });
    html += `</div>`;
    document.getElementById('relatedSection').innerHTML = html;
}
function goToProduct(pid) { window.location.href = `product.html?pid=${pid}`; }

// سلة قابلة للسحب
const floatingCartElem = document.getElementById('floatingCart');
let isDragging = false, dragOccurred = false, startX, startY, startLeft, startBottom;
if (floatingCartElem) floatingCartElem.addEventListener('pointerdown', (e) => {
    isDragging = true; dragOccurred = false;
    const rect = floatingCartElem.getBoundingClientRect();
    startLeft = rect.left; startBottom = window.innerHeight - rect.bottom;
    startX = e.clientX; startY = e.clientY;
    floatingCartElem.style.transition = 'none';
    e.preventDefault();
});
window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragOccurred = true;
    let newLeft = startLeft + dx, newBottom = startBottom - dy;
    newLeft = Math.min(window.innerWidth - 80, Math.max(8, newLeft));
    newBottom = Math.min(window.innerHeight - 40, Math.max(60, newBottom));
    floatingCartElem.style.left = `${newLeft}px`;
    floatingCartElem.style.bottom = `${newBottom}px`;
    floatingCartElem.style.top = 'auto'; floatingCartElem.style.right = 'auto';
});
window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    floatingCartElem.style.transition = '';
    if (!dragOccurred) toggleCart();
    dragOccurred = false;
});

// الوضع المظلم
function initDarkMode() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch(e){}
    if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    var tt = document.getElementById('themeToggle');
    if(tt) tt.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const nxt = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nxt);
        try { localStorage.setItem('theme', nxt); } catch(e){}
    });
}

document.addEventListener('DOMContentLoaded', () => {
    try { initDarkMode(); } catch(e){ console.warn('darkmode', e); }
    try { loadCart(); } catch(e){ console.warn('cart', e); }
    try { loadProduct(); } catch(e){ console.warn('product', e); }
    try { var __sf = document.getElementById('submitOrderFinal'); if (__sf) __sf.addEventListener('click', submitOrderFinal); } catch(e){}
});
window.addToCart = addToCart; window.toggleCart = toggleCart; window.checkoutFromCart = checkoutFromCart;
window.updateQty = updateQty; window.removeCartItem = removeCartItem; window.changeMainImage = changeMainImage;

function closeLightbox(){ try{ var lb=document.getElementById('phLightbox'); if(!lb) return; lb.classList.remove('open'); document.body.style.overflow=''; }catch(e){} }
window.openLightbox = openLightbox; window.closeLightbox = closeLightbox;
window.submitExpressOrder = submitExpressOrder; window.directBuy = directBuy; window.goToProduct = goToProduct;
